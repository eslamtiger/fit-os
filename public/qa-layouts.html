<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FIT OS — Responsive QA</title><style>body{margin:0;background:#dce3d5;color:#213827;font:15px system-ui}header{background:white;padding:18px;position:sticky;top:0;z-index:2}h1{font-size:18px;margin:0 0 10px}button{padding:10px 13px;margin:3px;border:1px solid #bacbaa;border-radius:8px;background:#f2f7eb;cursor:pointer}button.active{background:#24422d;color:white}.info{font-size:12px;margin:10px 0}#frame-wrap{margin:18px auto;position:relative;direction:ltr}iframe{position:absolute;top:0;left:0;border:0;box-shadow:0 5px 30px #17311933;transform-origin:top left;background:white}</style><header><h1>FIT OS — اختبار أحجام الشاشات</h1><div id="sizes"></div><div class="info" id="info"></div></header><div id="frame-wrap"><iframe id="preview" src="/" title="معاينة FIT OS"></iframe></div><script>const sizes=[[360,800],[390,844],[412,915],[768,1024],[1366,768],[1920,1080]];let current=sizes[0];const wrap=document.getElementById('frame-wrap'),frame=document.getElementById('preview');function resize(){const [w,h]=current,scale=Math.min(1,(window.innerWidth-40)/w);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';wrap.style.width=w*scale+'px';wrap.style.height=h*scale+'px';document.getElementById('info').textContent='المقاس الفعلي داخل المعاينة: '+w+' × '+h+' — مقياس العرض: '+Math.round(scale*100)+'%';document.querySelectorAll('button').forEach((b,i)=>b.className=sizes[i]===current?'active':'')}sizes.forEach(size=>{const b=document.createElement('button');b.textContent=size.join(' × ');b.onclick=()=>{current=size;resize()};document.getElementById('sizes').append(b)});window.addEventListener('resize',resize);resize();</script></html>
